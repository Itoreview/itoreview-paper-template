[project]
name = "itoreview-paper"
version = "1.0.0"
description = "The code behind an Itoreview paper: every figure, regenerated with one command."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Itoreview" }]
requires-python = ">=3.14,<3.15"
# Exactly what Pyodide 314.0.7 ships, so a figure drawn in a reader's browser (the "Run" button on
# itoreview.org) comes from the same libraries as the committed files. Change these only together
# with the Pyodide version in pyodide/package.json, and regenerate the figures.
dependencies = [
    "numpy==2.4.6",
    "matplotlib==3.10.8",
]

[project.scripts]
figures = "paper.figures:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.16.9",
]

[tool.uv]
# The rest of matplotlib's stack, held at Pyodide's versions too.
constraint-dependencies = [
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "fonttools==4.62.1",
    "kiwisolver==1.5.0",
    "packaging==26.1",
    "pillow==12.2.0",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
]

[tool.uv.build-backend]
module-name = "paper"

[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["–"]  # the en dash joining two names, as in Black–Scholes

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
